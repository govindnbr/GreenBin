{% extends "base.html" %}

{% block title %}Welcome to GreenBin{% endblock %}

{% block content %}
<div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;">
    <div style="width: 100%; max-width: 400px;">
        
        <!-- Logo Section -->
        <div style="text-align: center; margin-bottom: 40px;">
            <div style="background: var(--primary-green); width: 80px; height: 80px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; box-shadow: 0 10px 30px rgba(76, 175, 80, 0.3);">
                <i class="fas fa-leaf" style="font-size: 2rem; color: white;"></i>
            </div>
            <h2 style="color: var(--primary-green); font-weight: bold; margin-bottom: 8px;">GreenBin</h2>
            <p style="color: var(--text-light); margin: 0;">Turn plastic waste into rewards</p>
        </div>

        <!-- Login Form -->
        <div style="background: var(--white); border-radius: 25px; padding: 30px; box-shadow: 0 10px 40px rgba(0,0,0,0.1); border: 1px solid rgba(76, 175, 80, 0.1);">
            <h3 style="color: var(--text-dark); text-align: center; margin-bottom: 30px; font-weight: 600;">Welcome Back</h3>
            
            <form method="POST">
                <div style="margin-bottom: 20px;">
                    <label style="color: var(--text-dark); font-weight: 500; margin-bottom: 8px; display: block;">Username</label>
                    <div style="position: relative;">
                        <input type="text" 
                               id="username" 
                               name="username" 
                               required
                               style="width: 100%; padding: 15px 15px 15px 45px; border: 2px solid var(--light-gray); border-radius: 15px; font-size: 1rem; transition: all 0.3s ease; background: var(--light-gray);"
                               placeholder="Enter your username"
                               onfocus="this.style.borderColor='var(--primary-green)'; this.style.background='var(--white)'"
                               onblur="this.style.borderColor='var(--light-gray)'; this.style.background='var(--light-gray)'">
                        <i class="fas fa-user" style="position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: var(--text-light);"></i>
                    </div>
                </div>
                
                <div style="margin-bottom: 25px;">
                    <label style="color: var(--text-dark); font-weight: 500; margin-bottom: 8px; display: block;">Password</label>
                    <div style="position: relative;">
                        <input type="password" 
                               id="password" 
                               name="password" 
                               required
                               style="width: 100%; padding: 15px 15px 15px 45px; border: 2px solid var(--light-gray); border-radius: 15px; font-size: 1rem; transition: all 0.3s ease; background: var(--light-gray);"
                               placeholder="Enter your password"
                               onfocus="this.style.borderColor='var(--primary-green)'; this.style.background='var(--white)'"
                               onblur="this.style.borderColor='var(--light-gray)'; this.style.background='var(--light-gray)'">
                        <i class="fas fa-lock" style="position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: var(--text-light);"></i>
                    </div>
                </div>
                
                <button type="submit" 
                        style="width: 100%; padding: 15px; background: var(--primary-green); color: white; border: none; border-radius: 15px; font-size: 1.1rem; font-weight: 600; cursor: pointer; transition: all 0.3s ease; box-shadow: 0 4px 15px rgba(76, 175, 80, 0.3);"
                        onmouseover="this.style.transform='translateY(-2px)'; this.style.boxShadow='0 6px 20px rgba(76, 175, 80, 0.4)'"
                        onmouseout="this.style.transform='translateY(0)'; this.style.boxShadow='0 4px 15px rgba(76, 175, 80, 0.3)'">
                    <i class="fas fa-sign-in-alt" style="margin-right: 8px;"></i>Login
                </button>
            </form>
            
            <div style="text-align: center; margin: 25px 0;">
                <span style="color: var(--text-light);">Don't have an account?</span>
                <a href="{{ url_for('auth.register') }}" 
                   style="color: var(--primary-green); text-decoration: none; font-weight: 600; margin-left: 5px;">
                   Sign up
                </a>
            </div>
        </div>

    </div>
</div>

{% endblock %}
